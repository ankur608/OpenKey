name: "Release OpenKey Desktop Companion"

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-and-release:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'windows-latest'
            args: ''
          - platform: 'macos-latest'
            args: ''
          - platform: 'ubuntu-22.04'
            args: ''

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: desktop_manager/package-lock.json

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: desktop_manager/src-tauri

      # Linux system dependencies for WebKitGTK, FUSE, and HIDAPI
      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.0-dev \
            build-essential \
            curl \
            wget \
            file \
            libssl-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libudev-dev \
            libhidapi-dev \
            libfuse2 \
            pkg-config

      - name: Install NPM dependencies
        working-directory: desktop_manager
        run: npm ci

      - name: Build Tauri Desktop Companion
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: './desktop_manager'
          tagName: ${{ github.ref_name }}
          releaseName: 'OpenKey Desktop Companion ${{ github.ref_name }}'
          releaseBody: |
            ## OpenKey Hardware Security Key Manager
            Official cross-platform release for Windows, macOS, and Linux.

            - **Windows**: `.msi` installer & `.exe` standalone
            - **macOS**: `.dmg` disk image & `.app` bundle
            - **Linux**: `.deb` package & `.AppImage` standalone portable binary
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
