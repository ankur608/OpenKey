<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none" class="openkey-fido2-logo">
  <defs>
    <!-- Brand Primary Gradient -->
    <linearGradient id="ok-grad-primary" x1="15%" y1="10%" x2="85%" y2="90%">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="50%" stop-color="#06B6D4" />
      <stop offset="100%" stop-color="#3B82F6" />
    </linearGradient>

    <!-- Metallic Obsidian Shield Gradient -->
    <linearGradient id="ok-grad-shield" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#0B132B" stop-opacity="0.98" />
    </linearGradient>

    <!-- Gold PCB / Contact Gradient -->
    <linearGradient id="ok-grad-gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCD34D" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>

    <!-- Touch Sensor Radial Glow -->
    <radialGradient id="ok-touch-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#06B6D4" stop-opacity="0.8" />
      <stop offset="55%" stop-color="#10B981" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#10B981" stop-opacity="0" />
    </radialGradient>

    <!-- Neon Glow Filter -->
    <filter id="ok-glow" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="ok-subtle-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- 1. Background Cryptographic Security Shield (FIDO2 Authentication Perimeter) -->
  <path d="M50 14 L82 24 C82 56 50 86 50 86 C50 86 18 56 18 24 Z" 
        fill="url(#ok-grad-shield)" 
        stroke="url(#ok-grad-primary)" 
        stroke-width="2" 
        stroke-linejoin="round" />

  <!-- Shield Internal Bevel Accent -->
  <path d="M50 18 L76 26 C76 52 50 78 50 78 C50 78 24 52 24 26 Z" 
        fill="none" 
        stroke="#334155" 
        stroke-width="1" 
        stroke-opacity="0.5" />

  <!-- 2. Open-Source Hardware PCB Circuit Traces -->
  <!-- Left Trace & Via Pad -->
  <path d="M28 32 L34 38 L34 50 L28 56" 
        fill="none" 
        stroke="url(#ok-grad-gold)" 
        stroke-width="1.4" 
        stroke-linecap="round" />
  <circle cx="28" cy="32" r="1.8" fill="url(#ok-grad-gold)" />
  <circle cx="28" cy="56" r="1.8" fill="url(#ok-grad-gold)" />

  <!-- Right Trace & Via Pad -->
  <path d="M72 32 L66 38 L66 50 L72 56" 
        fill="none" 
        stroke="url(#ok-grad-gold)" 
        stroke-width="1.4" 
        stroke-linecap="round" />
  <circle cx="72" cy="32" r="1.8" fill="url(#ok-grad-gold)" />
  <circle cx="72" cy="56" r="1.8" fill="url(#ok-grad-gold)" />

  <!-- 3. Physical Hardware Security Key (USB-C Dongle Body) -->
  <!-- USB-C Plug Blade at Top -->
  <rect x="42" y="5" width="16" height="12" rx="3.5" 
        fill="#1E293B" 
        stroke="#64748B" 
        stroke-width="1.5" />
  <!-- USB-C Contact Pins (Gold) -->
  <line x1="45" y1="8" x2="45" y2="12" stroke="url(#ok-grad-gold)" stroke-width="1.2" stroke-linecap="round" />
  <line x1="48.5" y1="8" x2="48.5" y2="12" stroke="url(#ok-grad-gold)" stroke-width="1.2" stroke-linecap="round" />
  <line x1="51.5" y1="8" x2="51.5" y2="12" stroke="url(#ok-grad-gold)" stroke-width="1.2" stroke-linecap="round" />
  <line x1="55" y1="8" x2="55" y2="12" stroke="url(#ok-grad-gold)" stroke-width="1.2" stroke-linecap="round" />

  <!-- Main Hardware Key Silhouette / Carrier -->
  <rect x="36" y="15" width="28" height="52" rx="7" 
        fill="#0F172A" 
        stroke="#475569" 
        stroke-width="1.6" />

  <!-- 4. Open-Source Hardware Gear / Sensor Notch Motif -->
  <!-- Outer OSHW Gear Radiations -->
  <g stroke="url(#ok-grad-primary)" stroke-width="2" stroke-linecap="round" opacity="0.85">
    <line x1="50" y1="26" x2="50" y2="29" />
    <line x1="50" y1="53" x2="50" y2="56" />
    <line x1="36" y1="41" x2="39" y2="41" />
    <line x1="61" y1="41" x2="64" y2="41" />
    <line x1="40" y1="31" x2="42" y2="33" />
    <line x1="60" y1="51" x2="58" y2="49" />
    <line x1="60" y1="31" x2="58" y2="33" />
    <line x1="40" y1="51" x2="42" y2="49" />
  </g>

  <!-- 5. FIDO2 Capacitive Touch Ring (User Presence Target) -->
  <!-- Glow halo behind sensor -->
  <circle cx="50" cy="41" r="14" fill="url(#ok-touch-glow)" />

  <!-- Outer Pulse Ring -->
  <circle cx="50" cy="41" r="11" 
          fill="#1E293B" 
          stroke="url(#ok-grad-primary)" 
          stroke-width="2" 
          filter="url(#ok-subtle-glow)" />

  <!-- Mid Sensor Inset (Gold Touch Perimeter) -->
  <circle cx="50" cy="41" r="7.5" 
          fill="none" 
          stroke="url(#ok-grad-gold)" 
          stroke-width="1.2" 
          stroke-dasharray="8 3" />

  <!-- Center Capacitive Touch Core -->
  <circle cx="50" cy="41" r="4.2" 
          fill="url(#ok-grad-primary)" 
          filter="url(#ok-glow)" />

  <!-- 6. Hardware Status LED (Active Green / Cyan Pulse) -->
  <circle cx="50" cy="60" r="1.8" fill="#10B981" filter="url(#ok-glow)" />
  <circle cx="50" cy="60" r="1" fill="#A7F3D0" />

  <!-- Bottom Keyhole/Lanyard Loop Chamfer -->
  <path d="M46 64 C46 63 54 63 54 64" stroke="#64748B" stroke-width="1.2" stroke-linecap="round" />
</svg>
